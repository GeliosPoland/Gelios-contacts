<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olga Golovina — Gelios Poland</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f4f0;
      color: #252820;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 44px 28px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.05);
    }

    .brand {
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 600;
      color: #8b967c;
      text-transform: uppercase;
    }

    h1 {
      margin: 32px 0 8px;
      font-size: 28px;
      font-weight: 500;
    }

    .subtitle {
      margin-bottom: 32px;
      color: #77796f;
      font-size: 15px;
    }

    .button {
      display: block;
      padding: 16px 20px;
      border-radius: 10px;
      background: #354333;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
    }

    .footer {
      margin-top: 28px;
      color: #999b92;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">Gelios Poland</div>

    <h1>Olga Golovina</h1>

    <p class="subtitle">Dane kontaktowe</p>

    <a class="button" href="./Olga_Golovina.vcf">
      Zapisz kontakt
    </a>

    <div class="footer">SCIENCE · CARE · BEAUTY</div>
  </main>
</body>
</html>
